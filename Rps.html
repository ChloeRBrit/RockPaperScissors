<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //function to get a random number between 0 and whatever is inputted
        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }
        //the function to get computer choice
        //takes in whatever int you put then finds a number between them randomly
        //as you can see its only going to 2 since the max is 3 points. it would be  0 1 2
        //this is how it chooses randomly the attack
        function getComputerChoice() {
            const random = getRandomInt(3);
            if (random === 0) {
                return "rock";
            } else if (random === 1) {
                return "scissors";
            }
            return "paper";
        }
        //this is how we get the human choice.
        //first we prompt the human to give us a choice
        //if theres nothing it wont do anything, but if there is something the first thing is to lowercase it
        //then we check if its rock, paper or scissors
        function getHumanChoice() {
            let userChoice = prompt("Please enter rock, paper or scissors to see if you win against the CPU");
            if (!userChoice) {
                return null;
            }
            userChoice = userChoice.toLowerCase().trim();
            if (userChoice === "rock" || userChoice === "paper" || userChoice === "scissors") {
                return userChoice;
            }
            return null;
        }
        //this is how we play 1 single round of RPS.
        //first we check if its a tie by seeing if they are the same.
        //then we check if the human wins with the 3 choices it can make
        //if human wins we return human and give them a winner message
        // if the computer wins we give them a loser message and retuen computer
        function playRound(humanChoice, computerChoice) {
            if (humanChoice === computerChoice) {
                return {
                    winner: "tie",
                    message: "Tie! Both chose " + humanChoice
                };
            }
            if (
                (humanChoice === "rock" && computerChoice === "scissors") ||
                (humanChoice === "scissors" && computerChoice === "paper") ||
                (humanChoice === "paper" && computerChoice === "rock")
            ) {
                return {
                    winner: "human",
                    message: "You win! " + humanChoice + " beats " + computerChoice
                };
            }
            return {
                winner: "computer",
                message: "You lose! " + computerChoice + " beats " + humanChoice
            };
        }
        //this is how we play a game of 5 rounds
        //We intialize the variables for the score
        //then for each round we get a random computer choice
        //then we are getting out human choice and checking if its right.
        //we then check the result of each round played then increment the scores based on the returns from earlier
        //after each round we print a couple things so the human sees whats going on
        //at the end we print who won the game
        function playGame() {

            let humanScore = 0;
            let computerScore = 0;

            for (let round = 1; round <= 5; round++) {
                const computerChoice = getComputerChoice();
                const humanChoice = getHumanChoice();
                const result = playRound(humanChoice, computerChoice);

                if (result.winner === "human") {
                    humanScore += 1;
                } else if (result.winner === "computer") {
                    computerScore += 1;
                }

                console.log("Round " + round + ": " + result.message);
                console.log("You chose " + humanChoice);
                console.log("Computer chose " + computerChoice);
                console.log("Your score " + humanScore);
                console.log("Computer score " + computerScore);
            }

            console.log("Final score: You " + humanScore + " - Computer " + computerScore);
        }
        //this is us calling the functon to actually start the RPS
        playGame();
    </script>
</head>

</html>
